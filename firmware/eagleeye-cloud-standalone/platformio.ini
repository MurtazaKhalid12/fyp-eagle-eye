; EagleEye Cloud — PlatformIO (self-contained, no Arduino global libs).
; Sketch: src/main.cpp  |  Board: AI Thinker ESP32-CAM  |  Partition: huge_app
; ESP-NN: standalone lib/ESP-NN/ (embedded copy inside eagleeye_vision excluded
;         via lib/eagleeye_vision/library.json to prevent duplicate symbols).

[env:esp32cam]
platform = espressif32@6.5.0
board = esp32cam
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    ; Enable ESP-NN hardware-accelerated kernels in TFLite Micro
    -DEI_TFLITE_ENABLE_ESP_NN=1
    -DESP_NN
    ; WebSockets WiFi header workaround
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"
    -I"${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFiClientSecure/src"

; deep+ needed for TFLite Micro headers inside eagleeye_vision
lib_ldf_mode = deep+

; OLED display (Adafruit SSD1306 + GFX) — added by v2 modular architecture
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit BusIO @ ^1.14.1
